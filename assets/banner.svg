<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for soft blur on background elements -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }

    /* Ambient Dynamic Pulsing Orbs in Background */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(60px, 40px) scale(1.15); opacity: 0.5; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(-50px, -30px) scale(1.2); opacity: 0.45; }
    }

    /* Interactive circuit nodes */
    @keyframes waveFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 4px; opacity: 0.4; }
      50% { r: 7px; opacity: 1; }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; transform-origin: 250px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 950px 300px; }
    .flowing-path {
      stroke-dasharray: 20, 10;
      animation: waveFlow 25s linear infinite;
    }
    .pill-group-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-group-2 { animation: floatPill 7s ease-in-out infinite 1s; }
    .pill-group-3 { animation: floatPill 6.5s ease-in-out infinite 2s; }
    .pill-group-4 { animation: floatPill 7.5s ease-in-out infinite 0.5s; }

    .node-pulse-1 { animation: pulseNode 3s ease-in-out infinite; }
    .node-pulse-2 { animation: pulseNode 3s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Atmospheric Glows -->
  <g filter="url(#blurFilter)">
    <circle cx="200" cy="90" r="180" fill="url(#glowGrad1)" class="orb-1" />
    <circle cx="980" cy="310" r="220" fill="url(#glowGrad2)" class="orb-2" />
    <circle cx="600" cy="210" r="140" fill="#6366f1" opacity="0.12" />
  </g>

  <!-- Background Tech Grid / Circuit Patterns -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Flowing Neural Data Streams (Dynamic Aspect) -->
  <path d="M 80,350 Q 250,280 450,330 T 800,240 T 1150,150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" class="flowing-path" />
  <path d="M 50,120 Q 300,220 550,160 T 950,220 T 1150,300" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" class="flowing-path" style="animation-direction: reverse; animation-duration: 30s;" />

  <!-- Animated Neural Nodes -->
  <circle cx="450" cy="330" r="5" fill="#38bdf8" filter="url(#nodeGlow)" class="node-pulse-1" />
  <circle cx="800" cy="240" r="5" fill="#818cf8" filter="url(#nodeGlow)" class="node-pulse-2" />
  <circle cx="550" cy="160" r="5" fill="#c084fc" filter="url(#nodeGlow)" class="node-pulse-1" />
  <circle cx="950" cy="220" r="5" fill="#38bdf8" filter="url(#nodeGlow)" class="node-pulse-2" />

  <!-- FOREGROUND CONTENT: Header & High-Contrast Typography -->
  <!-- Tagline / Category -->
  <g transform="translate(100, 75)">
    <rect x="-10" y="-18" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="2" cy="-4" r="4" fill="#38bdf8" />
    <text x="16" y="0" class="tagline">CURATED KNOWLEDGE BASE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(100, 140)">
    <text class="title">
      Awesome <tspan fill="url(#accentGrad)">Personalized AI Tutoring</tspan> &amp; EdTech
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(100, 190)">
    <text class="subtitle">
      Socratic AI Companions • Adaptive STEM Solvers • Spaced Repetition • Speech Coaching
    </text>
  </g>

  <!-- Metric Badges & Focus Cards in Foreground -->
  <g transform="translate(100, 240)">
    <!-- Pill 1: Socratic LLMs -->
    <g class="pill-group-1" transform="translate(0, 0)">
      <rect width="220" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="24" y="26" class="pill-text">🧠 Socratic AI Tutors</text>
    </g>

    <!-- Pill 2: Math & Vision Solvers -->
    <g class="pill-group-2" transform="translate(240, 0)">
      <rect width="230" height="42" rx="21" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" />
      <text x="22" y="26" class="pill-text">📐 Vision STEM Solvers</text>
    </g>

    <!-- Pill 3: Spaced Repetition -->
    <g class="pill-group-3" transform="translate(490, 0)">
      <rect width="250" height="42" rx="21" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" />
      <text x="22" y="26" class="pill-text">🔄 Adaptive FSRS &amp; Anki</text>
    </g>

    <!-- Pill 4: Speech & Language -->
    <g class="pill-group-4" transform="translate(760, 0)">
      <rect width="230" height="42" rx="21" fill="url(#badgeGrad)" stroke="#ec4899" stroke-width="1.2" />
      <text x="22" y="26" class="pill-text">🎙️ AI Speech &amp; Phonics</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(100, 340)">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b" font-weight="500">
      ⚡ Comprehensive SaaS Pricing Breakdown &amp; 100% Free Open-Source Self-Hosted Alternatives
    </text>
  </g>
</svg>
